name: Build and test

on:
  push:

# Read-only access to the repository is all this workflow needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 🔁 Install packages
        run: npm ci

      - name: 🔍 Type check
        run: npm run compile

      - name: 🧪 Run unit tests
        run: npm test

      - name: 📦 Build and zip the extension
        run: npm run zip

      - name: 🔒 Security checks
        run: npm run check:security

      - name: ⬆️ Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: .output/*.zip
          # The zip is uploaded as it is, so the download is the extension zip itself, not a zip inside a zip.
          # The file name becomes the artifact's name.
          archive: false
          # .output starts with a dot, so the action would skip it as hidden. Only the zip matches the path.
          include-hidden-files: true
          if-no-files-found: error
